services:
  db:
    image: postgres:16-alpine
    container_name: dictare-db
    environment:
      POSTGRES_DB: dictare
      POSTGRES_USER: dictare
      POSTGRES_PASSWORD: dictare
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - dictare_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dictare -d dictare"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dictare_pgdata:
