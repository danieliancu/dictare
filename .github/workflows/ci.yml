name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  DATABASE_URL: postgres://dictare:dictare@localhost:5432/dictare
  SECRET_KEY: ci-only-not-secret-0123456789-abcdefghijklmnopqrstuvwxyz
  # manage.py defaults to config.settings.dev; pytest uses config.settings.test (pyproject).
  DEBUG: "True"
  ALLOWED_HOSTS: localhost,127.0.0.1,testserver
  # Tests never call OpenAI: no key is provided and the suite blocks real clients.
  OPENAI_API_KEY: ""
  TTS_PROVIDER: mock

jobs:
  test:
    name: Lint, checks, tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dictare
          POSTGRES_USER: dictare
          POSTGRES_PASSWORD: dictare
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dictare -d dictare"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install dependencies
        run: pip install -r requirements/dev.txt
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Django checks
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Tests (unit + integration)
        run: pytest -m "not e2e"

  e2e:
    name: Browser (Playwright)
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: dictare
          POSTGRES_USER: dictare
          POSTGRES_PASSWORD: dictare
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U dictare -d dictare"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Install dependencies
        run: |
          pip install -r requirements/dev.txt
          python -m playwright install --with-deps chromium
      - name: Responsive smoke tests
        run: pytest -m e2e
